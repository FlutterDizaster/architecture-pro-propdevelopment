apiVersion: v1
kind: ConfigMap
metadata:
  name: audit-policy
  namespace: kube-system
data:
  audit-policy.yaml: |
    apiVersion: audit.k8s.io/v1
    kind: Policy
    rules:
      - level: RequestResponse
        verbs: ["create", "delete", "update", "patch", "get", "list"]
        resources:
          - group: ""
            resources: ["pods", "secrets", "configmaps", "serviceaccounts", "roles", "rolebindings"]
      - level: Metadata
        resources:
          - group: "*"
            resources: ["*"]
